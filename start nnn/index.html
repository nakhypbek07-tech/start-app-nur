<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadAI — Жол ақауларын ескерту</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .bar {
      padding: 10px;
      background: #1f2937;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }
    input {
      background: #374151;
      color: #fff;
      min-width: 180px;
    }
    button {
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #1d4ed8;
    }
    #alertBox {
      display: none;
      background: #dc2626;
      color: #fff;
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }
    #map {
      height: calc(100vh - 105px);
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="alertBox"></div>
  <div class="bar">
    <button id="locateBtn">GPS қосу</button>
    <input id="defectInput" type="text" placeholder="Ақау түрі (мыс: шұңқыр)" />
    <button id="addDefectBtn">Нүкте қосу</button>
    <span id="status">GPS күтілуде...</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
